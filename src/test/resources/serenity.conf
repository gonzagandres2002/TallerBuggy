serenity {
    project.name = "Taller de automatizacion - Buggy Cars Rating"
    take.screenshots = AFTER_EACH_STEP
    use.unique.browser = false
    test.root = co.edu.udea.certificacion.buggy.rentacarros
    console.colors = true
    report {
        accessibility = true
    }
    requirement {
        types = "epic, feature"
    }
}

# Para correr sin ver el navegador (ej. en CI): gradle clean test -Dheadless.mode=true
headless.mode = false

webdriver {
  driver = chrome
  autodownload = true
  timeouts {
    # Espera implicita: Selenium espera hasta 10 s a que aparezca cada elemento (respuestas de la API)
    implicitlywait = 10000
  }
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
  }
}

chrome.switches = """--start-maximized;--test-type;--no-sandbox;--ignore-certificate-errors;
                   --disable-popup-blocking;--disable-default-apps;--disable-extensions-file-access-check;
                   --incognito;--disable-infobars;--disable-gpu;--remote-allow-origins=*"""

# Las URL viven aqui y no en el codigo (buena practica que pidio el profesor)
pages {
    buggyUrl = "https://buggy.justtestit.org/"
}
